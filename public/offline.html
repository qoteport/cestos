<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#184877" />
    <title>Offline · Cestos Operations</title>
    <style>
      body{font-family:Arial,sans-serif;background:#f4f7fb;color:#162334;margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;box-sizing:border-box}
      main{width:min(440px,100%);background:#fff;border:1px solid #d5deea;padding:32px;box-sizing:border-box}
      h1{font-size:22px;margin:0 0 12px}p{line-height:1.6;color:#526174;margin:0 0 20px}button{border:0;background:#184877;color:#fff;padding:12px 18px;font-weight:700;cursor:pointer}
    </style>
  </head>
  <body><main><h1>You’re offline</h1><p>Previously opened Cestos screens and data may be available on this device. Changes you submit while offline are stored locally and will sync after you reconnect.</p><p>Keep this browser profile and its site data until the sync queue is empty.</p><button onclick="location.reload()">Try again</button></main></body>
</html>
